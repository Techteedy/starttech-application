name: Backend CI/CD (Golang → EC2)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  AWS_REGION:    us-east-1
  GO_VERSION:    "1.21"
  IMAGE_NAME:    starttech-backend

jobs:
  # ══════════════════════════════════════════════
  # JOB 1: TEST
  # ══════════════════════════════════════════════
  test:
    name: Test & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        working-directory: backend
        run: go mod download

      - name: Run unit tests
        working-directory: backend
        run: go test ./... -v -coverprofile=coverage.out

      - name: Check test coverage
        working-directory: backend
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Test coverage: $COVERAGE%"

      - name: Go vet (code quality check)
        working-directory: backend
        run: go vet ./...

      - name: Vulnerability scan (govulncheck)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ══════════════════════════════════════════════
  # JOB 2: BUILD DOCKER IMAGE
  # ══════════════════════════════════════════════
  build:
    name: Build & Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_image: ${{ steps.meta.outputs.ecr_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="${{ github.run_number }}-${SHORT_SHA}"
          ECR_IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}"  >> $GITHUB_OUTPUT
          echo "ecr_image=${ECR_IMAGE}"  >> $GITHUB_OUTPUT
          echo "Image tag: $IMAGE_TAG"

      - name: Build Docker image
        working-directory: backend
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.meta.outputs.image_tag }} \
            -t ${{ steps.meta.outputs.ecr_image }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Scan Docker image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.ecr_image }}
          format: table
          exit-code: 0          # warn but don't block deploy
          severity: CRITICAL,HIGH

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.meta.outputs.ecr_image }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Image pushed: ${{ steps.meta.outputs.ecr_image }}"

  # ══════════════════════════════════════════════
  # JOB 3: DEPLOY TO EC2 (Rolling Update via ASG)
  # ══════════════════════════════════════════════
  deploy:
    name: Deploy to EC2 via ASG Rolling Update
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update Launch Template with new image version
        run: |
          # Get current launch template ID
          LT_ID=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ${{ secrets.ASG_NAME }} \
            --query 'AutoScalingGroups[0].LaunchTemplate.LaunchTemplateId' \
            --output text)

          echo "Launch Template ID: $LT_ID"

          # Create new version of launch template with updated image tag
          aws ec2 create-launch-template-version \
            --launch-template-id $LT_ID \
            --source-version '$Latest' \
            --launch-template-data "{\"UserData\":\"$(base64 -w0 scripts/userdata-deploy.sh)\"}"

      - name: Trigger rolling instance refresh (deploy)
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 120}' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "Instance refresh started: $REFRESH_ID"
          echo "REFRESH_ID=$REFRESH_ID" >> $GITHUB_ENV

      - name: Wait for rolling deploy to complete
        run: |
          echo "Waiting for instance refresh to complete..."
          for i in $(seq 1 30); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
              --instance-refresh-ids ${{ env.REFRESH_ID }} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Attempt $i/30 — Status: $STATUS"

            if [ "$STATUS" == "Successful" ]; then
              echo "✅ Deployment successful!"
              break
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ]; then
              echo "❌ Deployment $STATUS"
              exit 1
            fi

            sleep 30
          done

      - name: Run smoke test (health check on ALB)
        run: |
          echo "Running smoke test against ALB..."
          for i in $(seq 1 5); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              http://${{ secrets.ALB_DNS_NAME }}/health)

            echo "Health check attempt $i: HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" == "200" ]; then
              echo "✅ Smoke test passed!"
              exit 0
            fi
            sleep 10
          done

          echo "❌ Smoke test failed after 5 attempts"
          exit 1

      - name: Deployment summary
        run: |
          echo "✅ Backend deployed successfully!"
          echo "🐳 Image: ${{ needs.build.outputs.ecr_image }}"
          echo "🔁 ASG: ${{ secrets.ASG_NAME }}"
          echo "🌐 ALB: http://${{ secrets.ALB_DNS_NAME }}"
          echo "🕐 Time: $(date -u)"
