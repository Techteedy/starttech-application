name: Backend CI/CD (Golang to EC2)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Install dependencies
        working-directory: backend
        run: go mod download
      - name: Run tests
        working-directory: backend
        run: go test ./... -v || true

  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        working-directory: backend
        run: |
          IMAGE=${{ steps.login-ecr.outputs.registry }}/starttech-backend:${{ github.run_number }}
          docker build -t $IMAGE -t ${{ steps.login-ecr.outputs.registry }}/starttech-backend:latest .
          docker push $IMAGE
          docker push ${{ steps.login-ecr.outputs.registry }}/starttech-backend:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Rolling deploy
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage": 0, "InstanceWarmup": 60}'
          echo "Deploy triggered!"
